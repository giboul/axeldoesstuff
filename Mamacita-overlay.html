<!DOCTYPE html>
<html>
    <head>
        <style>
            .stop {
                position: relative;
                margin: 0;
            }
            .stop-media {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow: hidden;
            }
            .stop-media img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .stop-note-wrap {
                position: relative;
                min-height: 100vh;
            }
            .stop-note {
                position: relative;
                margin-top: 0vh;
                margin-bottom: 100vh;
                margin-inline: 5% 50%;
                background-color: white;
            }
        </style>
    </head>
    <body>

        <div class="stop">
            <img class="stop-media" src="images/familia/alix_mama_bateau.jpg"/>
            <div class="stop-note-wrap">
                <div class="stop-note">
                    comments
                </div>
            </div>
        </div>


        <div class="stop">
            <img class="stop-media" src="images/familia/abuelito_abuelita.jpg"/>
            <div class="stop-note-wrap">
                <div class="stop-note">
                    comments
                </div>
            </div>
        </div>

    </body>
</html>
