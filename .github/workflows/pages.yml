# Builds the site with Eleventy and publishes it on GitHub Pages at every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized photos are kept between runs, so only new pictures are processed.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            _site/img
          key: eleventy-img-${{ github.run_id }}
          restore-keys: eleventy-img-
      - id: pages
        uses: actions/configure-pages@v5
      - run: npx @11ty/eleventy
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
